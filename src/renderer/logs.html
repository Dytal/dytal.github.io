<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" />
  <title>Neurax — Logs</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/logs.css" />
</head>
<body class="logs-body">
  <div class="logs-wrap">
    <div class="logs-head">
      <h2><span class="live-dot"></span> Neurax Logs</h2>
      <div class="logs-filters" id="filters"></div>
    </div>
    <div class="logs-console" id="console"></div>
    <div class="logs-foot">
      <span id="count">0 lines</span>
      <span>All launcher, game and download output — stored in .neurax/logs/</span>
      <button class="btn small ghost" id="clear">Clear view</button>
    </div>
  </div>
  <script src="js/failsafe.js"></script>
  <script type="module" src="js/logs.js"></script>
  <script>try { window.__neuraxMarkBooted(); } catch (e) {}</script>
</body>
</html>
